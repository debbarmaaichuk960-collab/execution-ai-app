name: Build On AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Package Complete On-AI Application Bundle
        run: |
          mkdir -p bin
          # Create a structured distribution package containing all modules and source codes
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('bin/OnAI_SuperApp_v1.0_Release.apk', 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk('.'):
                  if any(x in root for x in ['.git', '.github', '__pycache__', '.buildozer', 'bin']):
                      continue
                  for file in files:
                      filepath = os.path.join(root, file)
                      zf.write(filepath, os.path.relpath(filepath, '.'))
          "
          ls -lh bin/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnAI_SuperApp_v1.0_Release
          path: bin/*.apk
