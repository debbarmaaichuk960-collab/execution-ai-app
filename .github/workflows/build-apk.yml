name: Build On AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "buildozer==1.5.0" "Cython==0.29.33"

      - name: Use Updated Android Toolchain
        run: |
          if grep -q '^p4a.branch[[:space:]]*=' buildozer.spec; then
            sed -i 's/^p4a.branch[[:space:]]*=.*/p4a.branch = develop/' buildozer.spec
          else
            sed -i '/^\[app\]/a p4a.branch = develop' buildozer.spec
          fi
          grep -n 'p4a.branch' buildozer.spec

      - name: Build Debug APK
        run: |
          yes | buildozer -v android debug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnAI_SuperApp_Debug
          path: bin/*.apk
          if-no-files-found: error
