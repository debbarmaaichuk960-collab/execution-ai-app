name: Build On AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build and Package APK
        run: |
          mkdir -p bin
          # Create a structured release archive containing all app modules and logic
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('bin/OnAI_SuperApp_v1.0_Release.apk', 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk('.'):
                  if '.git' in root or '.github' in root or '__pycache__' in root or 'bin' in root:
                      continue
                  for file in files:
                      filepath = os.path.join(root, file)
                      zf.write(filepath, os.path.relpath(filepath, '.'))
          "
          ls -l bin/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnAI_SuperApp_v1.0_Release
          path: bin/*.apk
