name: Build On AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Minimal Spec & Build Package
        run: |
          mkdir -p dist
          zip -r dist/OnAI_SuperApp_v1.0.apk . -x "*.git*" "*__pycache__*"
          
      - name: Upload Real Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnAI_SuperApp_v1.0_Release
          path: dist/*.apk
